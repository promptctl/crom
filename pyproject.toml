[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crom"
version = "0.1.0"
description = "lunch crom bowser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
]

[project.scripts]
crom = "crom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["crom"]
